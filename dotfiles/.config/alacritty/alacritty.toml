# entelequia-theme · Graphite & Vellum
# Alacritty edition — pairs with kitty.conf, polybar masthead, emacs theme.
# Palette
#   ink     #1c1a18  warm graphite          slate    #28241f  raised paper
#   vellum  #ede4d0  warm cream             muted    #7a7268  stone grey
#   copper  #a85a2c  burnt sienna           brass    #8a7437  aged brass

[window]
opacity         = 1.0
padding         = { x = 14, y = 14 }
dynamic_padding = false
decorations     = "none"
decorations_theme_variant = "Dark"

[font]
size           = 11.0
normal         = { family = "Cascadia Mono", style = "Medium" }
bold           = { family = "Cascadia Mono", style = "SemiBold" }
italic         = { family = "Cascadia Mono", style = "Medium Italic" }
bold_italic    = { family = "Cascadia Mono", style = "SemiBold Italic" }
builtin_box_drawing = true

[colors.primary]
background = "#1c1a18"
foreground = "#ede4d0"
dim_foreground = "#a6998a"
bright_foreground = "#f5edd9"

[colors.cursor]
text   = "#1c1a18"
cursor = "#a85a2c"

[colors.vi_mode_cursor]
text   = "#1c1a18"
cursor = "#c08a3e"

[colors.search.matches]
foreground = "#1c1a18"
background = "#c08a3e"

[colors.search.focused_match]
foreground = "#1c1a18"
background = "#a85a2c"

[colors.footer_bar]
foreground = "#ede4d0"
background = "#28241f"

[colors.hints.start]
foreground = "#1c1a18"
background = "#a85a2c"

[colors.hints.end]
foreground = "#1c1a18"
background = "#c08a3e"

[colors.line_indicator]
foreground = "#a85a2c"
background = "None"

[colors.selection]
text       = "#ede4d0"
background = "#a85a2c"

# 16-color ANSI — graphite/vellum/copper editorial mapping.
# Earth-tone family, deeply printed, not saturated.  color1 is copper
# so terminal apps using "red" (errors, git diff -, ls dirs) inherit
# the design's signature.
[colors.normal]
black   = "#28241f"
red     = "#a85a2c"
green   = "#7a8c5a"
yellow  = "#c08a3e"
blue    = "#5a7387"
magenta = "#8a6678"
cyan    = "#6f8a8a"
white   = "#ede4d0"

[colors.bright]
black   = "#7a7268"
red     = "#c97040"
green   = "#94a86c"
yellow  = "#d4a05a"
blue    = "#7395a8"
magenta = "#a3819b"
cyan    = "#8aa3a3"
white   = "#f5edd9"

[colors.dim]
black   = "#1c1a18"
red     = "#7a3920"
green   = "#5a6940"
yellow  = "#90672e"
blue    = "#42546a"
magenta = "#674b5a"
cyan    = "#506767"
white   = "#a6998a"
