;==========================================================
;
;   ENTELEQUIA · CURIE
;   GRAPHITE & VELLUM masthead — iter03 of entelequia-theme
;   See ~/src/entelequia-theme/ for the design source.
;
;   IMPORTANT: polybar's INI parser does NOT strip inline `;`
;   comments — it parses the entire RHS as the value.  Keep
;   all comments on their own lines.
;
;==========================================================

include-file = ~/.config/polybar/docky/config.ini
;; pywal-derived colors no longer authoritative for this bar.
;; The graphite-vellum palette below overrides everywhere it matters.
;; Including pywal still in case other modules reference ${color-custom.*}.
include-file = ~/.cache/wal/colors-polybar.ini

[settings]
inherit = settings
enable-ipc = true


;; ── Graphite & Vellum palette ─────────────────────────────────────────────
[colors]
ink        = #1c1a18
slate      = #28241f
vellum     = #ede4d0
muted      = #7a7268
copper     = #a85a2c
brass      = #8a7437


;; ── Bar: editorial masthead ───────────────────────────────────────────────
[bar/mymain]
inherit = bar/main
wm-restack = bspwm
override-redirect = true
top = true
bottom = false
height = 56
radius = 0
offset-y = 0
background = #ee28241f
foreground = ${colors.vellum}
border-bottom-size = 1
border-bottom-color = ${colors.copper}
padding-left = 4
padding-right = 0
module-margin-left = 0
module-margin-right = 0
line-size = 2

;; Type stack — Cascadia at three weights (display Bold, body Mono Medium,
;; meta Mono Medium 9pt) + Iosevka Aile small-caps labels + Phoenician fallback.
font-0 = "Cascadia Code:weight=Bold:size=14;3"
font-1 = "Iosevka Aile:weight=Medium:size=10;3"
font-2 = "Cascadia Mono:weight=Medium:size=12;3"
font-3 = "Cascadia Mono:weight=Medium:size=9;2"
font-4 = "JetBrainsMono Nerd Font:size=11;3"
font-5 = "Cascadia Code:weight=Bold:size=16;3"
font-6 = "Noto Sans Phoenician:size=14;4"
font-7 = "Noto Sans Symbols:size=12;3"

;; Composition: identity grouping → workspaces → (center) date → status register.
;; All your existing modules preserved; styling editorialised.
modules-left   = identity sep myworkspaces
modules-center = my-date
modules-right  = my-pulseaudio sep my-memory sep mywireless-network sep my-backlight sep mybattery sep my-datalocker sep my-keyboard-layout sep my-powermenu mysystray

cursor-click  = pointer
cursor-scroll = ns-resize


;; ── Identity wordmark ─────────────────────────────────────────────────────
[module/identity]
type = custom/text
format = "%{T1}%{F#a85a2c}ENTELEQUIA%{F-}%{T-}  %{T2}%{F#ede4d0}· CURIE%{F-}%{T-}"
format-padding = 3


;; ── Rule-line separator: thin muted glyph at typeline ───────────────────
;; Typeset rule mark — copper stays reserved for accent registers
;; (identity, workspace, focused border, power), avoids accent over-use.
[module/sep]
type = custom/text
format = "│"
format-foreground = ${colors.muted}
format-font = 2
format-padding = 1


;; ── Launcher (your existing — only colors updated) ────────────────────────
[module/mylauncher]
type = custom/text
content =
content-background = ${colors.copper}
content-foreground = ${colors.ink}
content-padding = 2
click-left = ~/.config/polybar/docky/scripts/launcher.sh &
click-right = ~/.config/polybar/docky/scripts/launcher.sh &


;; ── Workspaces — Phoenician via icon mapping ──────────────────────────────
;; bspwm desktop names default to "1" .. "10" (your bspwmrc).  We map each
;; numeric name to a Phoenician glyph for display; bspwm logic untouched.
[module/myworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

icon-0 = 1;𐤀
icon-1 = 2;𐤁
icon-2 = 3;𐤂
icon-3 = 4;𐤃
icon-4 = 5;𐤄
icon-5 = 6;𐤅
icon-6 = 7;𐤆
icon-7 = 8;𐤇
icon-8 = 9;𐤈
icon-9 = 10;𐤉
icon-default = 𐤀

format = <label-state>
format-padding = 1

label-active = %icon%
label-active-foreground = ${colors.copper}
label-active-underline = ${colors.copper}
label-active-padding = 2

label-occupied = %icon%
label-occupied-foreground = ${colors.vellum}
label-occupied-padding = 2

label-urgent = %icon%
label-urgent-foreground = ${colors.ink}
label-urgent-background = ${colors.copper}
label-urgent-padding = 2

label-empty = %icon%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2


;; ── Date (centerpiece) ────────────────────────────────────────────────────
[module/my-date]
type = internal/date
interval = 1.0
date     = %d.%m
time     = %a · %H:%M
date-alt = %a · %d %b %Y
format = <label>
label = %{T5}%{F#ede4d0}%date%%{F-}%{T-}   %{T3}%{F#7a7268}%time%%{F-}%{T-}


;; ── Status register modules — small-caps editorial labels + mono values ──

[module/my-filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = "DSK "
format-mounted-prefix-foreground = ${colors.muted}
format-mounted-prefix-font = 2
format-mounted-padding = 1
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.vellum}
label-mounted-font = 4

[module/my-pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.muted}
format-volume-prefix-font = 2
format-volume-padding = 1
format-muted = "VOL —"
format-muted-foreground = ${colors.muted}
format-muted-font = 2
format-muted-padding = 1
label-volume = %percentage%%
label-volume-foreground = ${colors.vellum}
label-volume-font = 4

[module/my-memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "MEM "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
label = %gb_used%
label-foreground = ${colors.vellum}
label-font = 4

[module/my-cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
label = %percentage%%
label-foreground = ${colors.vellum}
label-font = 4

[module/mywireless-network]
type = internal/network
interface = wlan0
interval = 1.0
format-connected = <label-connected>
format-connected-prefix = "NET "
format-connected-prefix-foreground = ${colors.muted}
format-connected-prefix-font = 2
format-connected-padding = 1
format-disconnected = "NET —"
format-disconnected-foreground = ${colors.muted}
format-disconnected-font = 2
format-disconnected-padding = 1
label-connected = •
label-connected-foreground = ${colors.copper}
label-connected-font = 1

[module/my-backlight]
type = internal/backlight
card = amdgpu_bl0
format = <label>
format-prefix = "BR "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
label = %percentage%%
label-foreground = ${colors.vellum}
label-font = 4

[module/mybattery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
poll-interval = 2
time-format = %H:%M
format-charging = <label-charging>
format-charging-prefix = "BAT+ "
format-charging-prefix-foreground = ${colors.copper}
format-charging-prefix-font = 2
format-charging-padding = 1
format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.muted}
format-discharging-prefix-font = 2
format-discharging-padding = 1
format-full = "BAT FULL"
format-full-foreground = ${colors.vellum}
format-full-font = 2
format-full-padding = 1
label-charging = %percentage%%
label-charging-foreground = ${colors.vellum}
label-charging-font = 4
label-discharging = %percentage%%
label-discharging-foreground = ${colors.vellum}
label-discharging-font = 4

[module/my-keyboard-layout]
type = custom/script
exec = setxkbmap -query 2>/dev/null | awk '/^layout:/ {print toupper($2); exit}'
interval = 2
format = <label>
format-prefix = "KB "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
format-foreground = ${colors.vellum}
format-font = 4
label = %output%
click-left = ~/.local/bin/kb-layout-next.sh

[module/my-datalocker]
type = custom/script
exec = ~/.local/bin/datalocker-status.sh 2>/dev/null
interval = 5
format = <label>
format-prefix = "DL "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
label = %output%
label-foreground = ${colors.vellum}
label-font = 4
click-left = nohup ~/.local/bin/datalocker-lock > /tmp/polybar-datalocker-click.log 2>&1 &

[module/my-powermenu]
type = custom/text
format = "%{T4}%{F#a85a2c}⏻%{F-}%{T-}"
format-padding = 1
click-left = ~/.local/bin/power-menu.sh &
click-right = ~/.local/bin/power-menu.sh &

[module/mysystray]
type = internal/tray
format-margin = 0pt
tray-spacing = 2pt
tray-size = 65%
format-background = ${colors.slate}

[module/org-clock]
type = custom/script
exec = ~/.local/bin/org-clock-status.sh
interval = 30
format = <label>
format-prefix = "CLK "
format-prefix-foreground = ${colors.muted}
format-prefix-font = 2
format-padding = 1
format-foreground = ${colors.copper}
label = %output%
click-left = emacsclient -c -e '(org-clock-goto)'
click-middle = ~/.local/bin/org-clock-control.sh
click-right = emacsclient -e '(org-clock-out)'
