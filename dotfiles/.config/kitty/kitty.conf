# Font configuration — Cascadia Mono Medium unifies the type stack with
# the polybar masthead's Cascadia Code Bold (hierarchy via weight, not
# family).  See entelequia-theme · Graphite & Vellum.
font_family      Cascadia Mono Medium
bold_font        Cascadia Mono SemiBold
italic_font      Cascadia Mono Medium Italic
bold_italic_font Cascadia Mono SemiBold Italic
font_size 13.0

# Cursor
cursor_shape block
cursor_blink_interval 0

# Window layout
remember_window_size  yes
initial_window_width  1200
initial_window_height 800
window_padding_width 10

# Tab bar (if you use tabs)
tab_bar_edge bottom
tab_bar_style powerline

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0

# URLs
url_style curly
detect_urls yes

# entelequia-theme · Graphite & Vellum palette
# (replaces the pywal-cached colors that used to be included here).
background             #1c1a18
foreground             #ede4d0
selection_background   #a85a2c
selection_foreground   #ede4d0
cursor                 #a85a2c
cursor_text_color      #1c1a18
url_color              #a85a2c
active_border_color    #a85a2c
inactive_border_color  #28241f

# Tab bar — copper for active, slate for inactive
active_tab_background    #a85a2c
active_tab_foreground    #1c1a18
inactive_tab_background  #28241f
inactive_tab_foreground  #ede4d0

# 16-color ANSI — earth-tone family.  color1 (red) is copper so terminal
# apps using "red" (errors, git diff -, ls dirs) inherit the signature.
color0   #28241f
color1   #a85a2c
color2   #7a8c5a
color3   #c08a3e
color4   #5a7387
color5   #8a6678
color6   #6f8a8a
color7   #ede4d0
color8   #7a7268
color9   #c97040
color10  #94a86c
color11  #d4a05a
color12  #7395a8
color13  #a3819b
color14  #8aa3a3
color15  #f5edd9

# Opacity — keep the existing slight transparency for compositor blending.
background_opacity 0.95

# Advanced
allow_remote_control yes

# Add keybindings for font scaling
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0