# SOPS creation rules
# Each machine has a dedicated passwordless GPG key for automated decryption at boot.
# Your personal key is added as secondary recipient so you can edit from curie/einstein.
#
# Setup instructions:
#   1. Generate the lovelace sops key on the server:
#        gpg --homedir /var/lib/sops --batch --generate-key <<EOF
#        %no-protection
#        Key-Type: EDDSA
#        Key-Curve: ed25519
#        Subkey-Type: ECDH
#        Subkey-Curve: cv25519
#        Name-Real: Lovelace SOPS
#        Name-Email: lovelace-sops@entelequia
#        Expire-Date: 0
#        EOF
#
#   2. Get the fingerprint:
#        gpg --homedir /var/lib/sops --list-keys
#
#   3. Update the pgp field below with the lovelace key fingerprint.
#      Optionally add your personal key fingerprint as a second recipient:
#        pgp: "LOVELACE_FP,PERSONAL_FP"
#
#   4. Export the lovelace public key so sops can encrypt for it from curie:
#        gpg --homedir /var/lib/sops --export --armor lovelace-sops@entelequia \
#            | gpg --import
#
#   5. Create and encrypt the secrets file:
#        cp sops/lovelace.yaml.template sops/lovelace.yaml
#        # Fill in the actual secret values
#        sops --encrypt --in-place sops/lovelace.yaml
#
#   6. Commit sops/lovelace.yaml (encrypted) to git.

creation_rules:
    - path_regex: sops/lovelace\.yaml$
      pgp: >-
        0E4534607A2FA8D112176DCEDDAA34F42A158809,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    - path_regex: sops/edison\.yaml$
      pgp: >-
        1902E1477A9D19FD73BBF7F47050A7747D28D4A9,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    # Kids' machine — Archimedes tutor key (generated on alucard via keys
    # host-sops / guix deploy -x), personal key as secondary recipient.
    - path_regex: sops/alucard\.yaml$
      pgp: >-
        B607E174ADDBEA492F8D0E6162032497FA92CF96,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    # Curie — alpha personal-agent key (generated on curie via
    # gpg --homedir /root/.gnupg), personal key as secondary recipient.
    - path_regex: sops/curie\.yaml$
      pgp: >-
        F85D92CAFE560BA70C32E776D4AAAB1C40D8029D,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    # Hopper — kids' machine, Archimedes tutor key for adrian (generated on
    # hopper via gpg --homedir /root/.gnupg), personal key as secondary recipient.
    - path_regex: sops/hopper\.yaml$
      pgp: >-
        61777DDACBDCE29C340DDF1582D249E14856D496,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    # Baroja — alpha personal-agent key (generated on baroja via
    # gpg --homedir /root/.gnupg), personal key as secondary recipient.
    - path_regex: sops/baroja\.yaml$
      pgp: >-
        7BFF3457442479BAD396C122AE6968E8FC6C9607,
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F

    # User-scope secrets (no machine key needed — decrypted interactively
    # via the user's personal GPG key, not via a systemd-style activation).
    - path_regex: sops/rafael\.yaml$
      pgp: >-
        6513C7248D7BECE2EC1BD34B70350DAD507FA72F
